openapi: 3.1.0
info:
  title: API de Gestión de Alojamiento - Ravenwood
  description: >
    Especificación de la API REST para el Sistema de Gestión de Alojamiento (SGA) 
    aplicado al alojamiento de solares residenciales "Ravenwood" en El Poblado, Medellín.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Servidor Local de Desarrollo

paths:
  /reservas:
    post:
      summary: CrearReservaUseCase - Crea un recurso nuevo
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearReservaDTO"
      responses:
        "201":
          description: Reserva creada exitosamente en estado PENDIENTE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservaDTO"
        "400":
          description: Violación de regla de dominio (Capacidad superada, solapamiento o fecha pasada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDominioDTO"

    get:
      summary: ConsultarReservasPorEstadoUseCase - Lista recursos con filtros
      operationId: consultarReservasPorEstado
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum:
              [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Tamaño de página obligatorio de 10 (12.4)
          schema:
            type: integer
            default: 10
            maximum: 10
      responses:
        "200":
          description: Página de reservas encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaReservasDTO"

  /reservas/{codigo}:
    get:
      summary: ConsultarReservaUseCase - Obtiene un recurso
      operationId: consultarReserva
      parameters:
        - $ref: "#/components/parameters/CodigoReservaParam"
      responses:
        "200":
          description: Reserva encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservaDTO"
        "404":
          description: Reserva no encontrada.

    put:
      summary: ModificarReservaUseCase - Reemplaza los datos modificables (7.5, RN-14)
      operationId: modificarReserva
      parameters:
        - $ref: "#/components/parameters/CodigoReservaParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModificarReservaDTO"
      responses:
        "200":
          description: Reserva modificada y recalculada con éxito.
        "400":
          description: Ajuste rechazado por violar reglas de dominio.

  /reservas/{codigo}/confirmar:
    put:
      summary: ConfirmarReservaUseCase - Operación de negocio
      operationId: confirmarReserva
      parameters:
        - $ref: "#/components/parameters/CodigoReservaParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                horaEstimadaLlegada:
                  type: string
                  example: "14:30"
              required: [horaEstimadaLlegada]
      responses:
        "200":
          description: Reserva confirmada correctamente.
        "400":
          description: No cumple el anticipo mínimo del 50% o falta la hora estimada.

  /reservas/{codigo}/cancelar:
    put:
      summary: CancelarReservaUseCase - Operación de negocio
      operationId: cancelarReserva
      parameters:
        - $ref: "#/components/parameters/CodigoReservaParam"
      responses:
        "200":
          description: Reserva cancelada exitosamente aplicando la política congelada.

  /reservas/{codigo}/registrar-llegada:
    put:
      summary: RegistrarLlegadaUseCase - Operación de negocio
      operationId: registrarLlegada
      parameters:
        - $ref: "#/components/parameters/CodigoReservaParam"
      responses:
        "200":
          description: Check-in exitoso; estado pasa a EN_CURSO.
        "400":
          description: El solar no está en estado PREPARADO o la reserva no está CONFIRMADA.

  /reservas/{codigo}/registrar-salida:
    put:
      summary: RegistrarSalidaUseCase - Operación de negocio
      operationId: registrarSalida
      parameters:
        - $ref: "#/components/parameters/CodigoReservaParam"
      responses:
        "200":
          description: Check-out exitoso y folio cerrado.
        "400":
          description: El folio tiene saldo pendiente de pago.

  /reservas/{codigo}/no-show:
    put:
      summary: DeclararNoShowUseCase - Operación de negocio
      operationId: declararNoShow
      parameters:
        - $ref: "#/components/parameters/CodigoReservaParam"
      responses:
        "200":
          description: Reserva marcada como NO_SHOW y noches liberadas.

  /reservas/{codigo}/folio:
    get:
      summary: ConsultarFolioUseCase - Sub-recurso de la reserva
      operationId: consultarFolio
      parameters:
        - $ref: "#/components/parameters/CodigoReservaParam"
      responses:
        "200":
          description: Detalle del folio con cargos, pagos y saldo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolioDTO"

  /reservas/{codigo}/folio/pagos:
    post:
      summary: RegistrarPagoUseCase - Crea un movimiento en el folio (RN-15)
      operationId: registrarPago
      parameters:
        - $ref: "#/components/parameters/CodigoReservaParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarPagoDTO"
      responses:
        "201":
          description: Pago registrado en el folio.

  /cotizaciones:
    post:
      summary: CotizarEstanciaUseCase - Calcular el valor y desglose sin crear recurso
      operationId: cotizarEstancia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CotizarEstanciaDTO"
      responses:
        "200":
          description: Cotización calculada exitosamente.

    /solares/disponibles:
    get:
      summary: ConsultarSolaresDisponiblesUseCase - Consultar con filtros para listar solares
      operationId: consultarSolaresDisponibles
      parameters:
        - name: fechaEntrada
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: fechaSalida
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
            maximum: 10
      responses:
        "200":
          description: Página de solares disponibles para el rango especificado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaSolaresDTO"

  /solares/{identificacion}:
    get:
      summary: ConsultarSolarUseCase - Obtiene el detalle completo de un Solar
      operationId: consultarSolar
      parameters:
        - name: identificacion
          in: path
          required: true
          schema:
            type: string
            example: "SOL-101"
      responses:
        "200":
          description: Detalle del solar encontrado.

  /externo/reservas:
    post:
      summary: RecibirReservaExternaUseCase - Crea un recurso desde el canal externo (RN-18, RN-19)
      operationId: recibirReservaExterna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearReservaExternaDTO"
      responses:
        "201":
          description: Reserva externa procesada e integrada.
        "409":
          description: Conflicto de disponibilidad o mensaje duplicado recibido.

components:
  parameters:
    CodigoReservaParam:
      name: codigo
      in: path
      required: true
      schema:
        type: string
        pattern: '^RES-\d{4}-\d{5}$'
        example: "RES-2026-00001"

    schemas:
    
    OcupanteRequestDTO:
      type: object
      required: [documento, nombre, fechaNacimiento]
      properties:
        documento:
          type: string
        nombre:
          type: string
        fechaNacimiento:
          type: string
          format: date
          description: Se evalúa para determinar si es facturable a la fecha de entrada.

    
    CrearReservaDTO:
      type: object
      properties:
        identificacionSolar:
          type: string
          example: "SOL-101"
        fechaEntrada:
          type: string
          format: date
          example: "2026-12-15"
        fechaSalida:
          type: string
          format: date
          example: "2026-12-18"
        canalOrigen:
          type: string
          enum: [PORTAL, DIRECTO, EXTERNO]
        cantidadMascotas:
          type: integer
          example: 0
        cantidadVehiculos:
          type: integer
          example: 1
        titular:
          $ref: '#/components/schemas/OcupanteRequestDTO'
        ocupantes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OcupanteRequestDTO'
      required: [identificacionSolar, fechaEntrada, fechaSalida, canalOrigen, titular, ocupantes]

   
    CotizarEstanciaDTO:
      type: object
      properties:
        identificacionSolar:
          type: string
          example: "SOL-101"
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        ocupantes:
          type: array
          minItems: 1
          items:
            type: object
            required: [fechaNacimiento]
            properties:
              fechaNacimiento:
                type: string
                format: date
      required: [identificacionSolar, fechaEntrada, fechaSalida, ocupantes]

   
    PaginaReservasDTO:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/ReservaDTO'
        paginaActual:
          type: integer
        totalPaginas:
          type: integer
        totalElementos:
          type: integer
        tamanoPagina:
          type: integer

    PaginaSolaresDTO:
      type: object
      properties:
        contenido:
          type: array
          items:
            type: object 
        paginaActual:
          type: integer
        totalPaginas:
          type: integer
        totalElementos:
          type: integer
        tamanoPagina:
          type: integer

    ReservaDTO:
      type: object
      properties:
        codigoReserva:
          type: string
          example: "RES-2026-00001"
        identificacionSolar:
          type: string
          example: "SOL-101"
        estado:
          type: string
          example: "PENDIENTE"
        valorTotal:
          type: number
          example: 405000.00

    FolioDTO:
      type: object
      properties:
        codigoFolio:
          type: string
          example: "FOL-2026-00001"
        saldoPendiente:
          type: number
          example: 0.00
        totalCargos:
          type: number
          example: 445000.00
        totalPagos:
          type: number
          example: 445000.00

    RegistrarPagoDTO:
      type: object
      properties:
        monto:
          type: number
          example: 200000.00
        medioPago:
          type: string
          enum: [EFECTIVO, TRANSFERENCIA, TARJETA_DEBITO, TARJETA_CREDITO]
      required: [monto, medioPago]

    ModificarReservaDTO:
      type: object
      properties:
        nuevaFechaEntrada:
          type: string
          format: date
        nuevaFechaSalida:
          type: string
          format: date

    CotizarEstanciaDTO:
      type: object
      properties:
        identificacionSolar:
          type: string
          example: "SOL-101"
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        cantidadOcupantes:
          type: integer

    CrearReservaExternaDTO:
      type: object
      properties:
        identificadorExterno:
          type: string
          example: "EXT-88392"
        canalOrigen:
          type: string
          example: "EXTERNO"

    ErrorDominioDTO:
      type: object
      properties:
        codigoError:
          type: string
          example: "REGLA_DOMINIO_VIOLADA"
        mensaje:
          type: string
          example: "Durante la Temporada Alta del Festival la estancia mínima es de 3 noches seguidas."
