openapi: 3.1.0
info:
  title: API de Gestión de Alojamiento - Ravenwood
  description: >
    Especificación de la API REST para el Sistema de Gestión de Alojamiento (SGA) 
    aplicado al alojamiento de solares residenciales "Ravenwood" en El Poblado, Medellín.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Servidor Local de Desarrollo

paths:
  /reservas:
    post:
      summary: Crear una nueva reserva
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaDTO'
      responses:
        '201':
          description: Reserva creada exitosamente en estado PENDIENTE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDTO'
        '400':
          description: Violación de regla de dominio (Capacidad superada, solapamiento o fecha pasada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDominioDTO'

    get:
      summary: Consultar reservas
      operationId: consultarReservas
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW]
      responses:
        '200':
          description: Listado de reservas encontrado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaDTO'

  /reservas/{codigo}:
    get:
      summary: Consultar detalle de reserva por código
      operationId: consultarReservaPorCodigo
      parameters:
        - $ref: '#/components/parameters/CodigoReservaParam'
      responses:
        '200':
          description: Reserva encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaDTO'
        '404':
          description: Reserva no encontrada.

    put:
      summary: Modificar reserva activa (Fechas, Solar u Ocupantes)
      operationId: modificarReserva
      parameters:
        - $ref: '#/components/parameters/CodigoReservaParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificarReservaDTO'
      responses:
        '200':
          description: Reserva modificada y recalculada con éxito.
        '400':
          description: Ajuste rechazado por violar reglas de dominio.

  /reservas/{codigo}/confirmar:
    put:
      summary: Confirmar una reserva pendiente
      operationId: confirmarReserva
      parameters:
        - $ref: '#/components/parameters/CodigoReservaParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                horaEstimadaLlegada:
                  type: string
                  example: "14:30"
              required: [horaEstimadaLlegada]
      responses:
        '200':
          description: Reserva confirmada correctamente.
        '400':
          description: No cumple el anticipo mínimo del 50% o falta la hora estimada.

  /reservas/{codigo}/registrar-llegada:
    put:
      summary: Registrar llegada del grupo (Check-in)
      operationId: registrarLlegada
      parameters:
        - $ref: '#/components/parameters/CodigoReservaParam'
      responses:
        '200':
          description: Check-in exitoso; estado pasa a EN_CURSO.
        '400':
          description: El solar no está en estado PREPARADO o la reserva no está CONFIRMADA.

  /reservas/{codigo}/registrar-salida:
    put:
      summary: Registrar salida del grupo (Check-out)
      operationId: registrarSalida
      parameters:
        - $ref: '#/components/parameters/CodigoReservaParam'
      responses:
        '200':
          description: Check-out exitoso y folio cerrado.
        '400':
          description: El folio tiene saldo pendiente de pago.

  /reservas/{codigo}/folio:
    get:
      summary: Consultar folio de la estancia
      operationId: consultarFolio
      parameters:
        - $ref: '#/components/parameters/CodigoReservaParam'
      responses:
        '200':
          description: Detalle del folio con cargos, pagos y saldo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolioDTO'

  /reservas/{codigo}/folio/pagos:
    post:
      summary: Registrar un pago en el folio
      operationId: registrarPago
      parameters:
        - $ref: '#/components/parameters/CodigoReservaParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarPagoDTO'
      responses:
        '201':
          description: Pago registrado en el folio.

components:
  parameters:
    CodigoReservaParam:
      name: codigo
      in: path
      required: true
      schema:
        type: string
        pattern: '^RES-\d{4}-\d{5}$'
        example: "RES-2026-00001"

  schemas:
    CrearReservaDTO:
      type: object
      properties:
        identificacionSolar:
          type: string
          example: "SOL-101"
        fechaEntrada:
          type: string
          format: date
          example: "2026-12-15"
        fechaSalida:
          type: string
          format: date
          example: "2026-12-18"
        canalOrigen:
          type: string
          enum: [PORTAL, DIRECTO, EXTERNO]
        cantidadMascotas:
          type: integer
          example: 3
        cantidadVehiculos:
          type: integer
          example: 2
        documentoTitular:
          type: string
          example: "1094857392"
      required: [identificacionSolar, fechaEntrada, fechaSalida, canalOrigen, documentoTitular]

    ReservaDTO:
      type: object
      properties:
        codigoReserva:
          type: string
          example: "RES-2026-00001"
        identificacionSolar:
          type: string
          example: "SOL-101"
        estado:
          type: string
          example: "PENDIENTE"
        valorTotal:
          type: number
          example: 405000.00

    FolioDTO:
      type: object
      properties:
        codigoFolio:
          type: string
          example: "FOL-2026-00001"
        saldoPendiente:
          type: number
          example: 0.00
        totalCargos:
          type: number
          example: 445000.00
        totalPagos:
          type: number
          example: 445000.00

    RegistrarPagoDTO:
      type: object
      properties:
        monto:
          type: number
          example: 200000.00
        medioPago:
          type: string
          enum: [EFECTIVO, TRANSFERENCIA, TARJETA_DEBITO, TARJETA_CREDITO]
      required: [monto, medioPago]

    ModificarReservaDTO:
      type: object
      properties:
        nuevaFechaEntrada:
          type: string
          format: date
        nuevaFechaSalida:
          type: string
          format: date

    ErrorDominioDTO:
      type: object
      properties:
        codigoError:
          type: string
          example: "REGLA_DOMINIO_VIOLADA"
        mensaje:
          type: string
          example: "Durante la Temporada Alta del Festival la estancia mínima es de 3 noches seguidas."